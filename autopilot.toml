# Backlash twins (A/B the ±1° gear-play model; same training recipe)
[train.scenarios.velocity-backlash]
task = "Mjlab-Velocity-Flat-Backlash-MicroDuck"

[train.scenarios.velocity-rough-backlash]
task = "Mjlab-Velocity-Rough-Backlash-MicroDuck"

[train.scenarios.velstand-backlash]
task = "Mjlab-VelStand-Flat-Backlash-MicroDuck"

[train.scenarios.velstand-rough-backlash]
task = "Mjlab-VelStand-Rough-Backlash-MicroDuck"

[train.scenarios.standup-backlash]
task = "Mjlab-StandUp-Flat-Backlash-MicroDuck"

[train.scenarios.standup-rough-backlash]
task = "Mjlab-StandUp-Rough-Backlash-MicroDuck"

[train.scenarios.sitstand-backlash]
task = "Mjlab-SitStand-Flat-Backlash-MicroDuck"

[train.scenarios.sitstand-rough-backlash]
task = "Mjlab-SitStand-Rough-Backlash-MicroDuck"

[train.scenarios.groundpick-backlash]
task = "Mjlab-GroundPick-Flat-Backlash-MicroDuck"

[train.scenarios.groundpick-rough-backlash]
task = "Mjlab-GroundPick-Rough-Backlash-MicroDuck"

[train.scenarios.ballkick-backlash]
task = "Mjlab-BallKick-Flat-Backlash-MicroDuck"

[train.scenarios.rollers-backlash]
task = "Mjlab-Velocity-Flat-Backlash-MicroDuck-Rollers"

[train.scenarios.swizzle-backlash]
task = "Mjlab-Velocity-Swizzle-Backlash-MicroDuck"

[train.scenarios.roller-crouch-backlash]
task = "Mjlab-RollerCrouch-Flat-Backlash-MicroDuck"

[train.scenarios.roller-slope-backlash]
task = "Mjlab-RollerSlope-Flat-Backlash-MicroDuck"

[safety]
# What the LLM may change (tyro CLI spellings, fnmatch patterns).
allow = [
  "env.rewards.*.weight",
  "agent.max-iterations",
  "agent.algorithm.learning-rate",
  "agent.algorithm.entropy-coef",
  "env.scene.num-envs",
]
# Everything not matching `allow` is rejected. This also keeps obs terms
# (env.observations.*), robot/actuator cfg and curricula (env.events.*) off
# limits — those are AGENTS.md invariants, see docs/autopilot.md.
deny = []
max_changes = 1                # one change per intervention, so its effect is attributable
penalty_eps = 0.01             # Episode_Reward/<penalty> above this = sign bug

# Numeric bounds per pattern (also applied to the daemon's own relaunch flags).
[safety.ranges]
"env.rewards.*.weight" = [-10.0, 10.0]
"agent.max-iterations" = [1, 20000]
"agent.algorithm.learning-rate" = [1e-6, 0.01]
"agent.algorithm.entropy-coef" = [0.0, 0.5]
"env.scene.num-envs" = [64, 32768]
