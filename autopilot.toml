# microduck_rl training autopilot — see docs/autopilot.md
#
# Monitors a local mjlab run, checks AGENTS.md invariants, asks the local
# Ollama model for a diagnosis and (auto=true) applies allowlisted overrides:
# smoke test -> stop -> resume from the latest checkpoint with the change.

[paths]
# The training project this autopilot supervises: tfevents are read from
# <mjlab_repo>/logs/rsl_rl and spawned training runs with that cwd.
mjlab_repo = "../microduck_rl"

[auto]
# true  = daemon validates + smoke-tests + applies + relaunches on its own
# false = writes recommendation JSON only (human runs `autopilot apply`)
enabled = true
# Start `train.command` by itself when nothing is running. Leave false unless
# you want the daemon to own the very first launch too.
start_if_idle = false

[dashboard]
# Local web UI. The daemon serves it; `autopilot dashboard` does too when the
# daemon is not running. host is loopback or one private address on this
# machine (0.0.0.0 is rejected).
enabled = true
host = "127.0.0.1"
port = 8765

[llm]
base_url = "http://127.0.0.1:11434"
model = "qwen3.5:35b-a3b-q4_K_M"
# Native /api/chat: the answer is constrained to the rec JSON schema, so the
# model can think first (reasoning is kept on the rec as llm_meta.thinking).
# max_tokens covers thinking + answer; context is the server's
# OLLAMA_CONTEXT_LENGTH (65536), the payload is ~5k tokens.
think = true
max_tokens = 16000
timeout_s = 900
temperature = 0.2

[monitor]
tick_s = 60                    # daemon poll interval
analyze_every_iters = 5        # consult the LLM every N new iterations
active_after_s = 300           # run dir with tfevents newer than this = active
min_iters_before_intervene = 500 # never touch a run younger than this
stagnation_window = 100        # iterations considered by trend rules
stagnation_min_iters = 200     # stagnation rule only fires after this many
stagnation_rel_gain = 0.02     # mean_reward gain below this over window = flat
cooldown_iters = 300           # min iterations between two interventions; also
                               # the window the revert check judges a change on.
                               # PPO needs hundreds of iters to answer a reward
                               # change; the LLM is not asked meanwhile.
max_interventions = 12         # budget per experiment, then human only
confidence_min = 0.6           # LLM confidence required to auto-apply

[train]
# First-launch command (legacy; scenarios below take precedence when set).
command = "uv run train Mjlab-Velocity-Flat-MicroDuck --env.scene.num-envs 4096"
# Default scenario for `autopilot launch` with no argument.
default_scenario = "velocity"
# Shared args appended to every scenario launch (override per scenario).
scenario_args = ["--env.scene.num-envs", "4096"]
# Ordered training queue: the daemon walks it when idle (needs
# auto.start_if_idle=true). A scenario is "done" when its plan completes;
# an abort parks it (reset --queue re-enables). Empty = never auto-chain.
queue = []
smoke_envs = 64                # AGENTS.md smoke test
smoke_iters = 5
smoke_timeout_s = 1200
stop_grace_s = 180             # SIGINT -> wait for a final checkpoint -> SIGTERM
save_interval = 50             # set on every relaunch: rsl_rl only saves a
                               # checkpoint every save_interval iters, so this
                               # bounds what an intervention can lose
# Extra env for spawned training. WANDB_MODE is NOT set here: the autopilot
# adds WANDB_MODE=offline only when there are no wandb credentials; with
# ~/.netrc present, runs log to the dashboard and tfevents feed the analysis.
[train.env]

# --- scenario catalog (mjlab task registry, one entry per policy family) ---
# task = registered task id; args (optional) overrides scenario_args;
# max_iterations (optional) pins the plan length; env (optional) adds env;
# warm_start_from (optional) = run dir: loads its LATEST checkpoint with
# MICRODUCK_WARM_START=1 (weights kept, curricula reset — AGENTS.md).
# Locomotion
[train.scenarios.velocity]
task = "Mjlab-Velocity-Flat-MicroDuck"

[train.scenarios.velocity-rough]
task = "Mjlab-Velocity-Rough-MicroDuck"

[train.scenarios.velstand]
task = "Mjlab-VelStand-Flat-MicroDuck"

[train.scenarios.velstand-rough]
task = "Mjlab-VelStand-Rough-MicroDuck"

# Posture / episodic
[train.scenarios.standup]
task = "Mjlab-StandUp-Flat-MicroDuck"

[train.scenarios.standup-rough]
task = "Mjlab-StandUp-Rough-MicroDuck"

[train.scenarios.sitstand]
task = "Mjlab-SitStand-Flat-MicroDuck"

[train.scenarios.sitstand-rough]
task = "Mjlab-SitStand-Rough-MicroDuck"

# Manipulation / dynamic tricks
[train.scenarios.groundpick]
task = "Mjlab-GroundPick-Flat-MicroDuck"

[train.scenarios.groundpick-rough]
task = "Mjlab-GroundPick-Rough-MicroDuck"

[train.scenarios.ballkick]
task = "Mjlab-BallKick-Flat-MicroDuck"

[train.scenarios.roulade]
task = "Mjlab-Roulade-Flat-MicroDuck"

# Roller-skate family
[train.scenarios.rollers]
task = "Mjlab-Velocity-Flat-MicroDuck-Rollers"

[train.scenarios.swizzle]
task = "Mjlab-Velocity-Swizzle-MicroDuck"

[train.scenarios.roller-crouch]
task = "Mjlab-RollerCrouch-Flat-MicroDuck"

[train.scenarios.roller-slope]
task = "Mjlab-RollerSlope-Flat-MicroDuck"

[train.scenarios.roller-standup]
task = "Mjlab-RollerStandUp-Flat-MicroDuck"

[train.scenarios.spin]
